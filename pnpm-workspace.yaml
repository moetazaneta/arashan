packages:
  - apps/*
  - packages/*

# One version of each dependency for the whole workspace: a package's manifest says "catalog:".
# `vp add` writes "catalog:" for anything listed here.
catalogMode: prefer

catalog:
  "@base-ui/react": 1.9.0
  "@clerk/localizations": 4.23.0
  "@clerk/react": 6.17.8
  "@clerk/ui": 1.40.2
  "@convex-dev/react-query": 0.1.0
  "@edge-runtime/vm": 5.0.0
  "@fontsource-variable/geist": 5.3.0
  "@lingui/cli": 6.10.0
  "@lingui/conf": 6.10.0
  "@lingui/core": 6.10.0
  "@lingui/format-po": 6.10.0
  "@lingui/react": 6.10.0
  "@lingui/vite-plugin": 6.10.0
  "@tailwindcss/vite": 4.3.3
  "@tanstack/react-query": 5.104.3
  "@tanstack/react-router": 1.170.45
  "@tanstack/router-plugin": 1.168.47
  "@testing-library/dom": 10.4.2
  "@testing-library/react": 16.3.3
  "@testing-library/user-event": 14.6.8
  "@types/node": 26.6.5
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.1.2
  class-variance-authority: 0.7.1
  cn: 0.5.0
  convex: 1.47.0
  convex-test: 0.0.62
  jsdom: 30.1.3
  lucide-react: 1.59.0
  react: 19.3.1
  react-dom: 19.3.1
  shadcn: 4.22.0
  tailwindcss: 4.3.3
  tw-animate-css: 1.4.0
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0

overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
# What a dependency may do beyond installing, set with `pnpm approve`. An agent skill from an approved
# package is linked into .agents/skills and .claude/skills on install, where git ignores it.
permissions:
  "@tanstack/router-plugin":
    skills: true
  # A dependency of @clerk/ui. Its install script only prints a message.
  core-js:
    build: false
  esbuild:
    build: false
