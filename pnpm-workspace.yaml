packages:
  - apps/*
  - packages/*

# One version of each dependency for the whole workspace: a package's manifest says "catalog:".
# `vp add` writes "catalog:" for anything listed here.
catalogMode: prefer

catalog:
  "@base-ui/react": 1.9.0
  "@fontsource-variable/geist": 5.3.0
  "@tailwindcss/vite": 4.3.3
  "@tanstack/react-router": 1.170.45
  "@tanstack/router-plugin": 1.168.47
  "@testing-library/dom": 10.4.2
  "@testing-library/react": 16.3.3
  "@types/node": 26.6.5
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.1.2
  class-variance-authority: 0.7.1
  cn: 0.5.0
  jsdom: 30.1.3
  lucide-react: 1.59.0
  react: 19.3.1
  react-dom: 19.3.1
  shadcn: 4.22.0
  tailwindcss: 4.3.3
  tw-animate-css: 1.4.0
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0

overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
