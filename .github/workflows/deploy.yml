name: Deploy

# Builds the web app in GitHub Actions and deploys the prebuilt output to Vercel: a preview for each
# pull request, and production for each push to main. Vercel's own builders have no Node.js 26 and
# no pnpm 12, so vercel.json turns off Vercel's Git builds. See docs/environment.md.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VERCEL_CLI: vercel@64.5.0
  VERCEL_TELEMETRY_DISABLED: "1"
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
  TARGET: ${{ github.event_name == 'push' && 'production' || 'preview' }}

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pull requests from forks and from Dependabot get no secrets, and the repository has none
      # before scripts/setup-services.sh runs. Then this run deploys nothing and passes.
      - name: Check the Vercel settings
        id: settings
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Vercel is not set up for this run (docs/environment.md), so nothing is deployed."
          fi

      - name: Checkout
        if: steps.settings.outputs.ready
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Vite+
        if: steps.settings.outputs.ready
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install locked dependencies
        if: steps.settings.outputs.ready
        run: vp install --frozen-lockfile

      # The variables of the target environment, such as VITE_CONVEX_URL, into
      # .vercel/.env.<target>.local.
      - name: Pull the Vercel environment
        if: steps.settings.outputs.ready
        run: vp dlx -s "$VERCEL_CLI" pull --yes --environment="$TARGET" --token="$VERCEL_TOKEN"

      # `vercel build` refuses a package.json whose engines.node is not a Node.js that Vercel has,
      # so vp builds the app and this step writes the Build Output API layout itself: the static
      # files, and a fallback to index.html for the SPA's routes.
      - name: Build
        if: steps.settings.outputs.ready
        run: |
          set -a
          . ".vercel/.env.$TARGET.local"
          set +a
          vp build
          rm -rf .vercel/output
          mkdir -p .vercel/output
          cp -R apps/web/dist .vercel/output/static
          cat > .vercel/output/config.json <<'JSON'
          {
            "version": 3,
            "routes": [{ "handle": "filesystem" }, { "src": "/(.*)", "dest": "/index.html" }]
          }
          JSON

      - name: Deploy
        id: deploy
        if: steps.settings.outputs.ready
        run: |
          url=$(vp dlx -s "$VERCEL_CLI" deploy --prebuilt --target="$TARGET" --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the preview URL
        if: steps.deploy.outputs.url && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.deploy.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none \
            --body "Preview: $URL (commit $SHA)"
